name: publish
on:
  schedule: [{ cron: '5,35 * * * *' }]
  workflow_dispatch:
    inputs:
      folder: { description: 'posts/<folder> to process (blank = the oldest unprocessed one)', required: false }
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: install tools
        run: cd tools && npm ci && npx playwright install --with-deps chromium
      - name: pick the job
        id: pick
        run: |
          f="${{ github.event.inputs.folder }}"
          if [ -z "$f" ]; then
            for d in $(ls -d posts/*/ 2>/dev/null | sort); do
              [ -f "${d}copy.json" ] && [ ! -f "${d}run.md" ] && { f="${d%/}"; break; }
            done
          fi
          echo "folder=$f" >> "$GITHUB_OUTPUT"
          [ -n "$f" ] && echo "processing $f" || echo "nothing to do"
      - name: gate, queue, record
        if: steps.pick.outputs.folder != ''
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/publish_job.sh "${{ steps.pick.outputs.folder }}" || true
      - name: commit the record
        if: steps.pick.outputs.folder != ''
        run: |
          git config user.name decoding-ai
          git config user.email decoding-ai@users.noreply.github.com
          git add "${{ steps.pick.outputs.folder }}/run.md" "${{ steps.pick.outputs.folder }}/sheet.jpg" state/done.json 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "run: ${{ steps.pick.outputs.folder }}"
          for i in 1 2 3 4 5; do git push -q origin HEAD:${{ github.ref_name }} && break; git pull -q --rebase; sleep 4; done
      - name: fail the run if the post did not queue
        if: steps.pick.outputs.folder != ''
        run: grep -q '^post: queued' "${{ steps.pick.outputs.folder }}/run.md"
