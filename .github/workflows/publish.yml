name: publish

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      folder:
        description: "posts/<folder> to process (blank = the oldest unprocessed one)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pick the job
        id: pick
        env:
          INPUT_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          # via env, never interpolated into the shell, so the input cannot inject commands
          f="$INPUT_FOLDER"
          case "$f" in ""|posts/[A-Za-z0-9._-]*) ;; *) echo "refusing folder: $f" >&2; exit 1;; esac
          if [ -z "$f" ]; then
            for d in $(ls -d posts/*/ 2>/dev/null | sort); do
              if [ -f "${d}copy.json" ] && [ ! -f "${d}run.md" ]; then f="${d%/}"; break; fi
            done
          fi
          echo "folder=$f" >> "$GITHUB_OUTPUT"
          if [ -n "$f" ]; then echo "processing $f"; else echo "nothing to do"; fi

      - name: install tools
        if: steps.pick.outputs.folder != ''
        run: |
          cd tools
          npm ci
          npx playwright install --with-deps chromium

      - name: gate, queue, record
        if: steps.pick.outputs.folder != ''
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOLDER: ${{ steps.pick.outputs.folder }}
        run: |
          bash tools/publish_job.sh "$FOLDER" || true

      - name: commit the record
        if: steps.pick.outputs.folder != ''
        run: |
          git config user.name decoding-ai
          git config user.email decoding-ai@users.noreply.github.com
          git add "${{ steps.pick.outputs.folder }}/run.md" state/done.json || true
          git add "${{ steps.pick.outputs.folder }}/sheet.jpg" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "run: ${{ steps.pick.outputs.folder }}"
            for i in 1 2 3 4 5; do
              git push -q origin "HEAD:${{ github.ref_name }}" && break
              git pull -q --rebase
              sleep 4
            done
          fi

      - name: fail the run if the post did not queue
        if: steps.pick.outputs.folder != ''
        env:
          FOLDER: ${{ steps.pick.outputs.folder }}
        run: |
          grep -q "^post. queued" "$FOLDER/run.md"
