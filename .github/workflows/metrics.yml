name: metrics

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST, after Buffer's daily metrics refresh
  workflow_dispatch:
    inputs:
      scoreboard:
        description: "send the weekly scoreboard today (1 = yes)"
        required: false
        default: ""

permissions:
  contents: write

# the same group as the publish worker, so the two never push state files at once
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: read metrics
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_REPO: ${{ github.repository }}
          METRICS_FORCE_SCOREBOARD: ${{ github.event.inputs.scoreboard }}
        run: bash tools/metrics.sh

      - name: commit
        run: |
          git config user.name decoding-ai
          git config user.email decoding-ai@users.noreply.github.com
          git add state/metrics.json
          if ! git diff --cached --quiet; then
            git commit -qm "metrics: $(date -u +%F)"
            for i in 1 2 3 4 5; do
              git push -q origin "HEAD:${{ github.ref_name }}" && break
              git pull -q --rebase
              sleep 4
            done
          fi
